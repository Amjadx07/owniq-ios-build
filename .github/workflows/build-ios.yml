name: Build OWNIQ iPhone IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphoneos:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout public build client
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install or verify XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d OWNIQ.xcodeproj
          xcodebuild -list -project OWNIQ.xcodeproj

      - name: Build unsigned app for physical iPhone
        run: |
          set -euo pipefail
          rm -rf DerivedData Payload build.log
          xcodebuild \
            -project OWNIQ.xcodeproj \
            -scheme OWNIQ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee build.log

      - name: Build simulator audit app
        run: |
          set -euo pipefail
          rm -rf SimulatorData simulator-build.log
          xcodebuild \
            -project OWNIQ.xcodeproj \
            -scheme OWNIQ \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/SimulatorData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee simulator-build.log

      - name: Capture five canonical screens
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; xs=[x for devices in d.values() for x in devices if x.get("isAvailable") and x.get("name")=="iPhone 16 Pro"]; xs=xs or [x for devices in d.values() for x in devices if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(xs[0]["udid"])')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find "$PWD/SimulatorData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name 'OWNIQ.app' -print -quit)
          test -n "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          for TAB in home scanner house inventory profile; do
            xcrun simctl terminate "$UDID" com.owniq.publicbuild || true
            xcrun simctl launch "$UDID" com.owniq.publicbuild --tab "$TAB"
            sleep 2
            xcrun simctl io "$UDID" screenshot "ui-${TAB}.png"
          done
          xcrun simctl shutdown "$UDID" || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/OWNIQ.app"
          IPA_PATH="$PWD/OWNIQ-0.9.1-premium-reference-unsigned.ipa"
          test -d "$APP_PATH"
          rm -rf Payload "$IPA_PATH" SHA256.txt
          mkdir -p Payload
          ditto "$APP_PATH" Payload/OWNIQ.app
          /usr/bin/zip -qry "$IPA_PATH" Payload
          test -s "$IPA_PATH"
          shasum -a 256 "$IPA_PATH" > SHA256.txt

      - name: Upload IPA and premium audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: OWNIQ-0.9.1-premium-reference-unsigned
          path: |
            OWNIQ-0.9.1-premium-reference-unsigned.ipa
            SHA256.txt
            build.log
            simulator-build.log
            ui-home.png
            ui-scanner.png
            ui-house.png
            ui-inventory.png
            ui-profile.png
          retention-days: 14
