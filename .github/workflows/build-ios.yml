name: Build private OWNIQ source on public macOS runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-iphoneos:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Verify private-repo credential exists
        env:
          OWNIQ_REPO_TOKEN: ${{ secrets.OWNIQ_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OWNIQ_REPO_TOKEN:-}" ]; then
            echo "::error::Repository secret OWNIQ_PRIVATE_REPO_TOKEN is missing."
            exit 1
          fi

      - name: Checkout private OWNIQ source
        uses: actions/checkout@v4
        with:
          repository: Amjadx07/owniq-native
          ref: recovery-0.7-safe-upgrade
          token: ${{ secrets.OWNIQ_PRIVATE_REPO_TOKEN }}
          path: src
          persist-credentials: false
          fetch-depth: 1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install or verify XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version

      - name: Generate Xcode project
        working-directory: src
        run: |
          set -euo pipefail
          python3 scripts/validate_repo.py
          xcodegen generate
          test -d OWNIQ.xcodeproj

      - name: Build unsigned app for physical iPhone
        working-directory: src
        run: |
          set -uo pipefail
          rm -rf DerivedData Payload
          LOG="$RUNNER_TEMP/owniq-xcodebuild.log"
          if xcodebuild \
            -project OWNIQ.xcodeproj \
            -scheme OWNIQ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build >"$LOG" 2>&1; then
            echo "OWNIQ iphoneos build succeeded."
          else
            echo "::error::OWNIQ iphoneos build failed. Sanitized compiler diagnostics follow."
            grep -E '(^| )error:|fatal error:' "$LOG" \
              | sed -E 's#^.*/([^/:]+\.swift):([0-9]+):([0-9]+): error:#\1:\2:\3: error:#' \
              | tail -n 120 || true
            exit 1
          fi

      - name: Package unsigned IPA
        working-directory: src
        run: |
          set -euo pipefail
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/OWNIQ.app"
          IPA_PATH="$PWD/OWNIQ-Native-0.9.1-Safe-Upgrade-unsigned.ipa"
          test -d "$APP_PATH"
          rm -rf Payload "$IPA_PATH" SHA256.txt
          mkdir -p Payload
          ditto "$APP_PATH" Payload/OWNIQ.app
          /usr/bin/zip -qry "$IPA_PATH" Payload
          test -s "$IPA_PATH"
          shasum -a 256 "$IPA_PATH" > SHA256.txt

      - name: Upload IPA only
        uses: actions/upload-artifact@v4
        with:
          name: OWNIQ-Native-0.9.1-Safe-Upgrade-unsigned
          path: |
            src/OWNIQ-Native-0.9.1-Safe-Upgrade-unsigned.ipa
            src/SHA256.txt
          retention-days: 14
