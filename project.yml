name: OWNIQ
options:
  bundleIdPrefix: com.owniq
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  OWNIQ:
    type: application
    platform: iOS
    sources:
      - path: Client
        excludes:
          - Rooms/RoomViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owniq.publicbuild
        PRODUCT_NAME: OWNIQ
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OWNIQ
        INFOPLIST_KEY_NSCameraUsageDescription: "OWNIQ utilise la caméra pour scanner des objets et, sur les appareils compatibles, une pièce en 3D."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "OWNIQ peut importer une photo choisie pour identifier un objet."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "OWNIQ utilise Face ID pour verrouiller l'accès local à tes objets et tes pièces."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 13
        MARKETING_VERSION: 0.9.1
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
    scheme:
      testTargets: []
